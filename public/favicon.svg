<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="ink-red" color-interpolation-filters="sRGB">
      <feFlood flood-color="#F93C20" result="color"/>
      <feComposite in="color" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="arrow-crop">
      <rect x="0" y="0" width="32" height="32"/>
    </clipPath>
  </defs>
  <!-- Crop to the arrow portion of the handwriting PNG (rightmost ~30%) -->
  <image
    href="/images/human-handwriting.png"
    x="-66" y="0" width="98" height="32"
    filter="url(#ink-red)"
    clip-path="url(#arrow-crop)"
  />
</svg>
