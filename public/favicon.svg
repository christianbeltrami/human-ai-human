<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="ink-red" color-interpolation-filters="sRGB">
      <feFlood flood-color="#F93C20" result="color"/>
      <feComposite in="color" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="arrow-crop">
      <rect x="0" y="0" width="32" height="32"/>
    </clipPath>
  </defs>
  <!-- Arrow is roughly x=666-925, y=140-285 in the 925x303 PNG.
       Scale so arrow fills 32x32: factor=0.124
       Full image: 115x38. Offset: x=-83, y=-10 -->
  <image
    href="/images/human-handwriting.png"
    x="-83" y="-10" width="115" height="38"
    filter="url(#ink-red)"
    clip-path="url(#arrow-crop)"
  />
</svg>
