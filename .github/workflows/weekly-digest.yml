name: Weekly digest

on:
  # Every Sunday at 9:00 AM Eastern (14:00 UTC)
  schedule:
    - cron: '0 14 * * 0'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  create-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Brevo draft campaign
        env:
          BREVO_API_KEY:      ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID:      ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_NAME:  "Christian Beltrami"
          BREVO_SENDER_EMAIL: "humancontact@human-ai-human.org"
          SITE_URL:           https://www.human-ai-human.org
        run: node scripts/create-digest.mjs
